<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="three-loops-title three-loops-desc">
  <title id="three-loops-title">Pedro's Law: three loops</title>
  <desc id="three-loops-desc">The specs loop (humans, specification) and the implementation loop (agent, implementation) are unchanged from the two-loops diagram; see that diagram for their detail. Attached to Merge, the production loop: CI/CD ships the merged change, live evaluation in production watches it against SLOs, and a rollback — triggered automatically on a breach or manually by a human — redeploys the previous stable version through CI/CD. After a rollback, the root cause always goes back to Specification work, never straight to the implementation loop. A fourth path: Stable's telemetry and business events, as operational and analytical data, feed a spec mining agent that proposes spec changes, closing the loop back to Specification work. An optional dashed path also lets a low-risk change skip Human review on the way to Merge.</desc>
  <defs>
    <marker id="tl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="tl-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="tl-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    <marker id="tl-arrow-prod" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f8a7a"/></marker>
    <marker id="tl-arrow-data" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7b5ea7"/></marker>
    <style>
