  <!-- right panel: brief description of each loop -->
  <circle cx="1226" cy="100" r="4" fill="#2e5aa8"/>
  <text x="1240" y="104" class="eb" fill="#2e5aa8">SPECS LOOP · HUMANS</text>
  <text x="1220" y="130" class="b">Many prompts: research, draft,</text>
  <text x="1220" y="150" class="b">challenge, decide. Approve one</text>
  <text x="1220" y="170" class="b">versioned, read-only spec.</text>

  <circle cx="1226" cy="220" r="4" fill="#2d3142"/>
  <text x="1240" y="224" class="eb" fill="#2d3142">IMPLEMENTATION LOOP · AGENT</text>
  <text x="1220" y="250" class="b">One controlled prompt: generate,</text>
  <text x="1220" y="270" class="b">evaluate, and fix — within the</text>
  <text x="1220" y="290" class="b">approved spec. No new decisions.</text>

  <circle cx="1226" cy="340" r="4" fill="#0f8a7a"/>
  <text x="1240" y="344" class="eb" fill="#0f8a7a">PRODUCTION LOOP · CI/CD</text>
  <text x="1220" y="370" class="b">Ship, watch live against SLOs, and</text>
  <text x="1220" y="390" class="b">roll back to the last stable version.</text>
  <text x="1220" y="410" class="b">The root cause always goes back</text>
  <text x="1220" y="430" class="b">to specification work.</text>

  <circle cx="1226" cy="460" r="4" fill="#7b5ea7"/>
  <text x="1240" y="464" class="eb" fill="#7b5ea7">DATA FEEDBACK · MINING AGENT</text>
  <text x="1220" y="490" class="b">Stable's telemetry and business</text>
  <text x="1220" y="510" class="b">events feed an agent that mines</text>
  <text x="1220" y="530" class="b">them and suggests spec changes —</text>
  <text x="1220" y="550" class="b">closing the loop.</text>

